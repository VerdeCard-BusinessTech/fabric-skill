name: verificacao

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verificacao:
    name: verificacao
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Procurar credenciais e dados pessoais
        run: python3 .github/scripts/verificar_segredos.py

      - name: Testes do script (se existir)
        if: hashFiles('scripts/fabric_query.py') != ''
        run: |
          python3 -m py_compile scripts/*.py
          python3 .github/scripts/testar_somente_leitura.py
